SolarTracker:
  description: 'Description of the data model SolarTracker '
  properties:
    address:
      description: The mailing address
      properties:
        addressCountry:
          description: The country. For example, Spain
          type: string
          x-ngsi:
            model: https://schema.org/addressCountry
            type: Property
        addressLocality:
          description: The locality in which the street address is, and which is in the region
          type: string
          x-ngsi:
            model: https://schema.org/addressLocality
            type: Property
        addressRegion:
          description: The region in which the locality is, and which is in the country
          type: string
          x-ngsi:
            model: https://schema.org/addressRegion
            type: Property
        district:
          description: A district is a type of administrative division that, in some countries, is managed by the local government
          type: string
          x-ngsi:
            type: Property
        postOfficeBoxNumber:
          description: The post office box number for PO box addresses. For example, 03578
          type: string
          x-ngsi:
            model: https://schema.org/postOfficeBoxNumber
            type: Property
        postalCode:
          description: The postal code. For example, 24004
          type: string
          x-ngsi:
            model: https://schema.org/https://schema.org/postalCode
            type: Property
        streetAddress:
          description: The street address
          type: string
          x-ngsi:
            model: https://schema.org/streetAddress
            type: Property
        streetNr:
          description: Number identifying a specific property on a public street
          type: string
          x-ngsi:
            type: Property
      type: object
      x-ngsi:
        model: https://schema.org/address
        type: Property
    alternateName:
      description: An alternative name for this item
      type: string
      x-ngsi:
        type: Property
    altitude:
      description: The elevation of the installation site above mean sea level. This value is used by the solar algorithm to refine the calculation of the sun's position and atmospheric refraction
      type: number
      x-ngsi:
        model: https://schema.org/Number
        type: Property
        units: meter (MTR)
    areaServed:
      description: The geographic area where a service or offered item is provided
      type: string
      x-ngsi:
        model: https://schema.org/Text
        type: Property
    backtracking:
      description: Enum:'on','off'. Indicates whether the solar tracker is in backtracking mode to prevent row-to-row shadowing, deviating from the optimal sun-angle position
      enum:
        - 'on'
        - 'off'
      type: string
      x-ngsi:
        model: https://schema.org/Text
        type: Property
    batteryLevel:
      description: Represents the current charge level of the battery, expressed as a percentage of its total capacity (0 to 100)
      maximum: 100
      minimum: 0
      type: number
      x-ngsi:
        model: https://schema.org/Number
        type: Property
        units: C62
    boardDirection:
      description: Enum:'-1','1'. Specifies the physical orientation of the control board based on the position of the emergency stop button (Eastward-facing = 1; Westward-facing = -1)
      enum:
        - '1'
        - '-1'
      type: string
      x-ngsi:
        model: https://schema.org/Text
        type: Property
    currentAngle:
      description: The current angular position of the panel. A value of 0 indicates the panel is horizontal (facing directly upward). Minimum values represent an Eastward orientation, while maximum values represent a Westward orientation
      maximum: 90
      minimum: -90
      type: number
      x-ngsi:
        model: https://schema.org/Number
        type: Property
        units: Degree Angle (DD)
    currentPowerConsumption:
      description: The real-time electrical power demand measured in Watts
      minimum: 0
      type: number
      x-ngsi:
        model: https://schema.org/Number
        type: Property
        units: Watt (WTT)
    dataProvider:
      description: A sequence of characters identifying the provider of the harmonised data entity
      type: string
      x-ngsi:
        type: Property
    dateCreated:
      description: Entity creation timestamp. This will usually be allocated by the storage platform
      format: date-time
      type: string
      x-ngsi:
        type: Property
    dateModified:
      description: Timestamp of the last modification of the entity. This will usually be allocated by the storage platform
      format: date-time
      type: string
      x-ngsi:
        type: Property
    dateUpdate:
      description: The date when the configuration was updated
      format: date-time
      type: string
      x-ngsi:
        model: http://schema.org/DateTime
        type: Property
    description:
      description: A description of this item
      type: string
      x-ngsi:
        type: Property
    deviceCategory:
      description: Enum:'PCU','FCU','SCU'. Specifies the classification of the device within the system
      enum:
        - PCU
        - FCU
        - SCU
      type: string
      x-ngsi:
        model: https://schema.org/Text
        type: Property
    deviceState:
      description: Enum:'Online','Offline'. Indicates the current operational connectivity status of the device
      enum:
        - Online
        - Offline
      type: string
      x-ngsi:
        model: https://schema.org/Text
        type: Property
    id:
      anyOf:
        - description: Identifier format of any NGSI entity
          maxLength: 256
          minLength: 1
          pattern: ^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$
          type: string
          x-ngsi:
            type: Property
        - description: Identifier format of any NGSI entity
          format: uri
          type: string
          x-ngsi:
            type: Property
      description: Unique identifier of the entity
      x-ngsi:
        type: Relationship
    ipAddress:
      description: List of IP address of the device. It can be a comma separated list of values if the device has more than one IP address
      items:
        anyOf:
          - description: If the IP address meets the requirements of V4 IP address
            format: ipv4
            x-ngsi:
              model: https://schema.org/Text
              type: Property
          - description: If the IP address meets the requirements of V6 IP address
            format: ipv6
            x-ngsi:
              model: https://schema.org/Text
              type: Property
        description: Every item in the list of IP address of the device
        type: string
        x-ngsi:
          model: https://schema.org/Text
          type: Property
      type: array
      x-ngsi:
        model: https://schema.org/Text
        type: Property
    location:
      description: Geojson reference to the item. It can be Point, LineString, Polygon, MultiPoint, MultiLineString or MultiPolygon
      oneOf:
        - description: Geojson reference to the item. Point
          properties:
            bbox:
              description: BBox of the  Point
              items:
                type: number
              minItems: 4
              type: array
              x-ngsi:
                type: Property
            coordinates:
              description: Coordinates of the Point
              items:
                type: number
              minItems: 2
              type: array
              x-ngsi:
                type: Property
            type:
